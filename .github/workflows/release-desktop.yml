name: Release Desktop App (macOS & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Upload installers to GitHub Releases (requires a tag or release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_flag: "--mac"
          - os: windows-latest
            platform_flag: "--win"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Sync package version with Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VERSION" --no-git-tag-version --workspaces --include-workspace-root --allow-same-version

      - name: Prepare desktop icons and frontend bundle
        shell: bash
        env:
          VITE_OFFICE_EDITOR_URL: ${{ vars.OFFICE_EDITOR_URL }}
        run: npm run prepare:bundle -w @sejong-office/desktop

      - name: Build and package Electron desktop app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --workspace @sejong-office/desktop electron-builder ${{ matrix.platform_flag }} --publish never

      - name: Upload desktop installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sejong-office-${{ matrix.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.blockmap
            packages/desktop/release/*.yml
          if-no-files-found: warn

  publish-release:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: sejong-office-macos-latest
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: sejong-office-windows-latest
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', '0.1.0') }}
        run: |
          ls -lh release-assets
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --title "Sejong Office $TAG_NAME" \
              --generate-notes
          fi
