name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # prebuild copies viewer assets and downloads the Paddle OCR models (network).
      - name: Install and build
        env:
          VITE_OFFICE_EDITOR_URL: ${{ vars.OFFICE_EDITOR_URL }}
        run: |
          npm ci
          npm run build

      # Vue Router uses HTML5 history; Pages serves 404.html for unknown paths.
      - name: SPA fallback
        run: cp packages/frontend/dist/index.html packages/frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
